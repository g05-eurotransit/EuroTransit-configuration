apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: eurotransit-platform-root
    patch: |-
      - op: replace
        path: /spec/source/path
        value: platform/argocd/environments/kind
