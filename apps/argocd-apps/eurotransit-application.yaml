apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eurotransit-marketplace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/carmelo-gulino/EuroTransit-configuration'
    targetRevision: main
    path: charts/eurotransit
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: eurotransit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
