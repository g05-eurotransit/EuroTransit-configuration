# AKS uses local Argo authentication; Keycloak remains the marketplace identity provider.
dex:
  enabled: false
applicationSet:
  # Chart 10.2.2 renders the controller unconditionally; replicas disables its pods.
  replicas: 0
controller:
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  copyutil:
    resources:
      requests:
        cpu: 25m
        memory: 16Mi
      limits:
        cpu: 250m
        memory: 64Mi
server:
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 250m
      memory: 192Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi
redisSecretInit:
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi
