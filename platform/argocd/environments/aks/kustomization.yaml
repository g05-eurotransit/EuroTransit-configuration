apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target:
      kind: Application
      name: keycloak-operator
    patch: |-
      - op: replace
        path: /spec/source
        value:
          repoURL: https://github.com/g05-eurotransit/EuroTransit-configuration.git
          targetRevision: main
          path: platform/keycloak-operator/environments/aks
