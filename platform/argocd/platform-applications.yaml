apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: eurotransit-platform
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: 36.3.0
      helm:
        valueFiles:
          - $values/platform/traefik/values.yaml
    - repoURL: https://github.com/carmelo-gulino/EuroTransit-configuration
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
