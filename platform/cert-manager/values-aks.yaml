replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
webhook:
  replicaCount: 1
  validatingWebhookConfiguration:
    namespaceSelector:
      matchExpressions:
      - key: cert-manager.io/disable-validation
        operator: NotIn
        values:
        - 'true'
      - key: control-plane
        operator: NotIn
        values:
        - 'true'
      - key: kubernetes.azure.com/managedby
        operator: NotIn
        values:
        - aks
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
cainjector:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 192Mi
startupapicheck:
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi
