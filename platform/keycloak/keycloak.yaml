apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: eurotransit-keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  instances: 1
  db:
    vendor: postgres
    host: eurotransit-postgres-rw.eurotransit.svc.cluster.local
    port: 5432
    database: keycloak_db
    usernameSecret:
      name: keycloak-db-credentials
      key: username
    passwordSecret:
      name: keycloak-db-credentials
      key: password
  bootstrapAdmin:
    user:
      secret: keycloak-admin-credentials
  http:
    httpEnabled: true
    serviceName: keycloak-service
  hostname:
    hostname: https://g05.cpo2026.it
    strict: true
  # Traefik routes Keycloak explicitly. Disable the operator-generated
  # catch-all Ingress so the marketplace root remains served by the frontend.
  ingress:
    enabled: false
  proxy:
    headers: xforwarded
  # The login theme travels as a ConfigMap rather than a rebuilt image: it is a stylesheet and a
  # properties file, and this keeps Keycloak on the upstream tag the operator expects. `items`
  # carries the CSS into the `resources/css/` subfolder a theme requires — ConfigMap keys cannot
  # hold a slash, mount paths can. Keycloak caches themes, so a change here needs a pod restart.
  unsupported:
    podTemplate:
      spec:
        containers:
          - volumeMounts:
              - name: eurotransit-login-theme
                mountPath: /opt/keycloak/themes/eurotransit/login
                readOnly: true
        volumes:
          - name: eurotransit-login-theme
            configMap:
              name: keycloak-theme-eurotransit
              items:
                - key: theme.properties
                  path: theme.properties
                - key: eurotransit.css
                  path: resources/css/eurotransit.css
  resources:
    requests:
      cpu: 150m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
