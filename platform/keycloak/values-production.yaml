ingress:
  enabled: true
  hostname: keycloak.eurotransit.example.com
  ingressClassName: traefik
  path: /
  pathType: Prefix
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: eurotransit-letsencrypt

replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    cpu: "2"
    memory: 3072Mi

postgresql:
  enabled: false

externalDatabase:
  host: keycloak-postgres-rw.keycloak.svc.cluster.local
  port: 5432
  database: keycloak_db
  user: keycloak
  existingSecret: keycloak-external-db-credentials
  existingSecretUserKey: username
  existingSecretPasswordKey: password

