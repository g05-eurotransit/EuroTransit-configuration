apiVersion: batch/v1
kind: Job
metadata:
  name: orders-service-client-secret-bootstrap
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
    app.kubernetes.io/component: keycloak-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: eurotransit-marketplace
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: configure-orders-client
          image: quay.io/keycloak/keycloak:26.7.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              attempt=1
              max_attempts=60
              while [ "$attempt" -le "$max_attempts" ]; do
                if /opt/keycloak/bin/kcadm.sh config credentials \
                  --server http://keycloak-service:8080 --realm master \
                  --user "$KEYCLOAK_ADMIN_USERNAME" --password "$KEYCLOAK_ADMIN_PASSWORD"; then
                  client_uuid="$(/opt/keycloak/bin/kcadm.sh get clients -r eurotransit \
                    -q clientId=orders-service --fields id --format csv --noquotes 2>/dev/null \
                    | tr -d '\r' | tail -n 1 || true)"
                  if [ -n "$client_uuid" ] && [ "$client_uuid" != "id" ] \
                    && /opt/keycloak/bin/kcadm.sh update "clients/$client_uuid" -r eurotransit \
                      -s "secret=$ORDERS_SERVICE_CLIENT_SECRET"; then
                    exit 0
                  fi
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              echo "orders-service client was not ready before the bootstrap deadline" >&2
              exit 1
          env:
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: password
            - name: ORDERS_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orders-service-credentials
                  key: client-secret
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
