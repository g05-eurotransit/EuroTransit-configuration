ingress:
  enabled: true
  hostname: keycloak.eurotransit.local
  ingressClassName: traefik
  path: /
  pathType: Prefix
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: eurotransit-selfsigned

replicaCount: 1

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 1024Mi

postgresql:
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

