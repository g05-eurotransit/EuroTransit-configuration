parent=keycloak.v2
import=common/keycloak

# The parent's stylesheet, then ours. `css/styles.css` is resolved from keycloak.v2 — a resource
# this theme does not hold comes from its parent — so only `css/eurotransit.css` is ours.
#
# The PatternFly vendor files are deliberately NOT listed: `import` already emits them from
# common/keycloak, and naming them here made the page request the same megabyte twice, once under
# /common/keycloak/ and once under /login/eurotransit/ (both answer 200, so nothing looks broken).
styles=css/styles.css css/eurotransit.css
