fullnameOverride: keycloak

auth:
  adminUser: eurotransit-admin
  existingSecret: keycloak-admin-credentials
  passwordSecretKey: admin-password

production: true
proxyHeaders: xforwarded
httpEnabled: true
hostnameStrict: true

replicaCount: 2

service:
  type: ClusterIP

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack

keycloakConfigCli:
  enabled: true
  cleanupAfterFinished:
    enabled: true
    seconds: 600
  configuration:
    eurotransit-realm.yaml: |
      realm: eurotransit
      enabled: true
      displayName: EuroTransit
      registrationAllowed: false
      resetPasswordAllowed: true
      loginWithEmailAllowed: true
      duplicateEmailsAllowed: false
      sslRequired: external
      roles:
        realm:
          - name: customer
            description: EuroTransit customer role for catalog, checkout, orders, and notifications
          - name: operations
            description: EuroTransit operational support role
          - name: admin
            description: EuroTransit administrative role
      clients:
        - clientId: eurotransit-frontend
          name: EuroTransit Frontend
          enabled: true
          publicClient: true
          standardFlowEnabled: true
          directAccessGrantsEnabled: false
          implicitFlowEnabled: false
          protocol: openid-connect
          redirectUris:
            - https://eurotransit.local/*
            - https://*.cpo2026.it/*
            - https://*.eurotransit.example.com/*
          webOrigins:
            - "+"
        - clientId: eurotransit-api
          name: EuroTransit API Audience
          enabled: true
          publicClient: false
          standardFlowEnabled: false
          directAccessGrantsEnabled: false
          serviceAccountsEnabled: false
          protocol: openid-connect
      clientScopes:
        - name: eurotransit-customer
          description: Customer-facing EuroTransit API scope
          protocol: openid-connect
        - name: eurotransit-operations
          description: Operations EuroTransit API scope
          protocol: openid-connect

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1536Mi

postgresql:
  enabled: true
  auth:
    username: bn_keycloak
    database: bitnami_keycloak
    existingSecret: keycloak-postgresql-credentials
    secretKeys:
      userPasswordKey: password
  architecture: standalone

