apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: eurotransit-keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # Keep every Keycloak path in its own router.  The previous compound
      # expression was selected by Traefik even for `/`, shadowing frontend.
      match: Host(`g05.cpo2026.it`) && PathPrefix(`/realms`)
      priority: 100
      services:
        - name: keycloak-service
          port: 8080
    - kind: Rule
      match: Host(`g05.cpo2026.it`) && PathPrefix(`/resources`)
      priority: 100
      services:
        - name: keycloak-service
          port: 8080
    - kind: Rule
      match: Host(`g05.cpo2026.it`) && PathPrefix(`/admin`)
      priority: 100
      services:
        - name: keycloak-service
          port: 8080
  tls:
    secretName: eurotransit-production-tls
