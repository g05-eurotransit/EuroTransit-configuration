apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: eurotransit-keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      # The frontend owns `/`.  Keycloak is exposed only for OIDC and its
      # administrative/static paths, so Traefik never has two equal matches
      # for the public homepage.
      match: Host(`g05.cpo2026.it`) && (PathPrefix(`/realms`) || PathPrefix(`/resources`) || PathPrefix(`/admin`))
      priority: 1
      services:
        - name: keycloak-service
          port: 8080
  tls:
    secretName: eurotransit-production-tls
