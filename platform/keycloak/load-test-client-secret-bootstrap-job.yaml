apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-client-secret-bootstrap
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
    app.kubernetes.io/component: keycloak-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: configure-load-test-client
          image: quay.io/keycloak/keycloak:26.7.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              # Suppress CLI diagnostics too: they can include credential payloads.
              kcadm() {
                /opt/keycloak/bin/kcadm.sh "$@" 2>/dev/null
              }

              reconcile_client() {
                kcadm config credentials --server http://keycloak-service:8080 \
                  --realm master --user "$KEYCLOAK_ADMIN_USERNAME" \
                  --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null || return 1
                kcadm get realms/eurotransit >/dev/null || return 1

                # Capture the CLI exit status before parsing, so a failed lookup
                # is never mistaken for an absent client or mapper.
                clients="$(kcadm get clients -r eurotransit \
                  -q clientId=eurotransit-load-test --fields id \
                  --format csv --noquotes)" || return 1
                client_uuid="$(printf '%s\n' "$clients" | tr -d '\r')"
                if [ "$client_uuid" = id ]; then client_uuid=; fi
                if [ -z "$client_uuid" ]; then
                  client_uuid="$(kcadm create clients -r eurotransit \
                    -s clientId=eurotransit-load-test -s enabled=true \
                    -s publicClient=false -s serviceAccountsEnabled=true \
                    -s standardFlowEnabled=false -s directAccessGrantsEnabled=false \
                    -s implicitFlowEnabled=false -s protocol=openid-connect -i)" || return 1
                fi
                kcadm update "clients/$client_uuid" -r eurotransit \
                  -s 'name=EuroTransit Progressive Delivery Load Test' \
                  -s 'description=Technical client used only by the suspended in-cluster k6 Job.' \
                  -s enabled=true -s publicClient=false \
                  -s clientAuthenticatorType=client-secret \
                  -s serviceAccountsEnabled=true -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false -s implicitFlowEnabled=false \
                  -s protocol=openid-connect -s fullScopeAllowed=true \
                  -s "secret=$LOAD_TEST_CLIENT_SECRET" >/dev/null || return 1

                mappers="$(kcadm get "clients/$client_uuid/protocol-mappers/models" \
                  -r eurotransit --fields id,name --format csv --noquotes)" || return 1
                mapper_uuid="$(printf '%s\n' "$mappers" | tr -d '\r' \
                  | while IFS=, read -r mapper_id mapper_name; do
                      if [ "$mapper_name" = "realm roles" ]; then printf '%s\n' "$mapper_id"; fi
                    done)"
                mapper_id_field=
                if [ -n "$mapper_uuid" ]; then
                  mapper_id_field="\"id\": \"$mapper_uuid\","
                fi
                cat > /tmp/load-test-realm-roles-mapper.json <<EOF
              {
                $mapper_id_field
                "name": "realm roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": false,
                "config": {
                  "claim.name": "realm_access.roles",
                  "jsonType.label": "String",
                  "multivalued": "true",
                  "access.token.claim": "true",
                  "id.token.claim": "true",
                  "userinfo.token.claim": "true",
                  "full.path": "false"
                }
              }
              EOF
                if [ -n "$mapper_uuid" ]; then
                  kcadm update "clients/$client_uuid/protocol-mappers/models/$mapper_uuid" \
                    -r eurotransit -f /tmp/load-test-realm-roles-mapper.json >/dev/null || return 1
                else
                  kcadm create "clients/$client_uuid/protocol-mappers/models" \
                    -r eurotransit -f /tmp/load-test-realm-roles-mapper.json >/dev/null || return 1
                fi

                service_account="$(kcadm get "clients/$client_uuid/service-account-user" \
                  -r eurotransit --fields id --format csv --noquotes)" || return 1
                service_account_uuid="$(printf '%s\n' "$service_account" | tr -d '\r')"
                [ -n "$service_account_uuid" ] && [ "$service_account_uuid" != id ] || return 1
                kcadm add-roles -r eurotransit --uid "$service_account_uuid" \
                  --rolename customer >/dev/null || return 1
              }

              attempt=1
              while [ "$attempt" -le 60 ]; do
                if reconcile_client; then
                  echo "Reconciled eurotransit-load-test client, realm roles mapper and customer role"
                  exit 0
                fi
                echo "Load-test client reconciliation pending; retrying ($attempt/60)" >&2
                attempt=$((attempt + 1))
                sleep 5
              done
              echo "Load-test client reconciliation did not finish before the bootstrap deadline" >&2
              exit 1
          env:
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin-credentials, key: username } }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin-credentials, key: password } }
            - name: LOAD_TEST_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: eurotransit-load-test-credentials, key: client-secret } }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
