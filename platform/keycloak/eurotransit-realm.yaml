apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: eurotransit
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  keycloakCRName: eurotransit-keycloak
  realm:
    realm: eurotransit
    enabled: true
    displayName: EuroTransit
    registrationAllowed: false
    resetPasswordAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    sslRequired: external
    roles:
      realm:
        - name: customer
          description: EuroTransit customer role for catalog, checkout, orders, and notifications
        - name: operations
          description: EuroTransit operational support role
        - name: admin
          description: EuroTransit administrative role
        - name: service
          description: EuroTransit internal service-to-service role
    users:
      # This is the service account role mapping, not a demo user or credential.
      - username: service-account-orders-service
        enabled: true
        serviceAccountClientId: orders-service
        realmRoles:
          - service
    clients:
      - clientId: eurotransit-frontend
        name: EuroTransit Frontend
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        protocol: openid-connect
        redirectUris:
          - https://g05.cpo2026.it/*
          - https://eurotransit.local/*
        webOrigins:
          - +
        protocolMappers:
          - name: subject
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: id
              claim.name: sub
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
          - name: realm roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            consentRequired: false
            config:
              claim.name: realm_access.roles
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
              full.path: "false"
      - clientId: eurotransit-api
        name: EuroTransit API Audience
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: false
        protocol: openid-connect
      - clientId: orders-service
        name: EuroTransit Orders Service
        enabled: true
        publicClient: false
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
        protocol: openid-connect
        protocolMappers:
          - name: realm roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            consentRequired: false
            config:
              claim.name: realm_access.roles
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
              id.token.claim: "true"
              userinfo.token.claim: "true"
              full.path: "false"
    clientScopes:
      - name: eurotransit-customer
        description: Customer-facing EuroTransit API scope
        protocol: openid-connect
      - name: eurotransit-operations
        description: Operations EuroTransit API scope
        protocol: openid-connect
