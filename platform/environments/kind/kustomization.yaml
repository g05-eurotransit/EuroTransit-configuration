apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - selfsigned-cluster-issuer.yaml
  - eurotransit-local-certificate.yaml
  - keycloak-local-certificate.yaml
  - ../../cloudnativepg
  - ../../strimzi
patches:
  - path: postgres-patch.yaml
  - path: kafka-nodepool-patch.yaml
  - path: kafka-patch.yaml
  - path: kafka-topics-kind-patch.yaml
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaTopic
      labelSelector: strimzi.io/cluster=eurotransit-kafka
  - path: connect-patch.yaml
  - path: remove-orders-sealedsecret.yaml
  - path: remove-inventory-sealedsecret.yaml
  - path: remove-payments-sealedsecret.yaml
