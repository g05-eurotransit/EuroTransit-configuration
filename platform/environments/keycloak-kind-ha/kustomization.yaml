apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../keycloak-kind
patches:
  - path: scheduling-patch.yaml
  - target:
      group: batch
      version: v1
      kind: Job
      name: (frontend-identity-claims-reconcile|keycloak-demo-users-bootstrap|load-test-client-secret-bootstrap)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
