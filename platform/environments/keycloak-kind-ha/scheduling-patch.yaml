# Identity is outside this experiment's worker-failure scope.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: eurotransit-keycloak
  namespace: keycloak
spec:
  scheduling:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [eurotransit-control-plane]
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
