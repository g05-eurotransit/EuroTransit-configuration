apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../keycloak
patches:
  - path: keycloak-patch.yaml
  - path: keycloak-ingressroute-patch.yaml
  - path: remove-orders-service-client-secret-bootstrap-job.yaml
  - target:
      group: k8s.keycloak.org
      version: v2beta1
      kind: KeycloakRealmImport
      name: eurotransit
    patch: |-
      - op: add
        path: /spec/realm/clients/2/secret
        value: orders-service-secret
