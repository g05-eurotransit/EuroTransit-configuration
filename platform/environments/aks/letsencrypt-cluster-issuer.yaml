apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: eurotransit-letsencrypt
spec:
  acme:
    email: admin@cpo2026.it
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: eurotransit-letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
