apiVersion: apps/v1
kind: Deployment
metadata: { name: inventory-outbox-connect, namespace: eurotransit }
spec:
  template:
    spec:
      containers:
        - name: connect
          env:
            - { name: CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
