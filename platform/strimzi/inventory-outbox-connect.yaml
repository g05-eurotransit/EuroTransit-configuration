apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-outbox-connect
  namespace: eurotransit
  labels:
    app: inventory-outbox-connect
    app.kubernetes.io/name: inventory-outbox-connect
    app.kubernetes.io/part-of: eurotransit-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-outbox-connect
  template:
    metadata:
      labels:
        app: inventory-outbox-connect
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:2.7.0.Final
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: eurotransit-kafka-kafka-bootstrap:9092
            - name: GROUP_ID
              value: inventory-outbox-connect
            - name: CONFIG_STORAGE_TOPIC
              value: inventory-outbox-connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: inventory-outbox-connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: inventory-outbox-connect-status
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-outbox-connect
  namespace: eurotransit
  labels:
    app: inventory-outbox-connect
    app.kubernetes.io/name: inventory-outbox-connect
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8083
      targetPort: http
  selector:
    app: inventory-outbox-connect
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-outbox-connector-register
  namespace: eurotransit
  labels:
    app.kubernetes.io/name: inventory-outbox-connector-register
    app.kubernetes.io/part-of: eurotransit-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: inventory-outbox-connector-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-db-credentials
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until curl -fsS http://inventory-outbox-connect:8083/ >/dev/null; do
                echo "waiting for inventory-outbox-connect"
                sleep 5
              done

              cat > /tmp/inventory-outbox-connector.json <<EOF
              {
                "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
                "tasks.max": "1",
                "database.hostname": "eurotransit-postgres-rw",
                "database.port": "5432",
                "database.user": "inventory",
                "database.password": "${INVENTORY_DB_PASSWORD}",
                "database.dbname": "inventory_db",
                "topic.prefix": "inventory",
                "plugin.name": "pgoutput",
                "value.converter": "org.apache.kafka.connect.json.JsonConverter",
                "value.converter.schemas.enable": "false",
                "slot.name": "inventory_outbox",
                "publication.name": "inventory_outbox_publication",
                "publication.autocreate.mode": "filtered",
                "table.include.list": "public.outbox_events",
                "tombstones.on.delete": "false",
                "transforms": "outbox",
                "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
                "transforms.outbox.table.field.event.key": "aggregate_id",
                "transforms.outbox.table.field.event.payload": "payload",
                "transforms.outbox.table.expand.json.payload": "true",
                "transforms.outbox.route.by.field": "type",
                "transforms.outbox.route.topic.replacement": "\${routedByValue}"
              }
              EOF

              status="$(curl -sS -o /tmp/connector-response.txt -w "%{http_code}" \
                -X PUT \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                --data @/tmp/inventory-outbox-connector.json \
                http://inventory-outbox-connect:8083/connectors/inventory-outbox-connector/config)"

              cat /tmp/connector-response.txt
              test "$status" = "200" || test "$status" = "201"
