apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: orders-outbox-connect
  namespace: eurotransit
  labels:
    app.kubernetes.io/name: orders-outbox-connect
    app.kubernetes.io/part-of: eurotransit-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    strimzi.io/use-connector-resources: "true"
spec:
  version: 3.9.0
  replicas: 1
  bootstrapServers: eurotransit-kafka-kafka-bootstrap:9092
  image: eurotransit/debezium-connect:local
  jvmOptions:
    -Xms: 256m
    -Xmx: 1024m
  config:
    group.id: orders-outbox-connect
    config.storage.topic: orders-outbox-connect-configs
    offset.storage.topic: orders-outbox-connect-offsets
    status.storage.topic: orders-outbox-connect-status
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  template:
    connectContainer:
      env:
        - name: ORDERS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orders-db-credentials
              key: password
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: orders-outbox-connector
  namespace: eurotransit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    strimzi.io/cluster: orders-outbox-connect
    app.kubernetes.io/name: orders-outbox-connector
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  autoRestart:
    enabled: true
    maxRestarts: 10
  config:
    database.hostname: eurotransit-postgres-rw
    database.port: 5432
    database.user: orders
    database.password: ${env:ORDERS_DB_PASSWORD}
    database.dbname: orders_db
    topic.prefix: orders
    plugin.name: pgoutput
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    slot.name: orders_outbox
    publication.name: orders_outbox_publication
    publication.autocreate.mode: filtered
    table.include.list: public.outbox_events
    tombstones.on.delete: false
    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.route.by.field: type
    transforms.outbox.route.topic.replacement: ${routedByValue}
