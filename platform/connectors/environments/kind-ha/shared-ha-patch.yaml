apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: orders-outbox-connect
  namespace: eurotransit
spec:
  replicas: 2
  jvmOptions: {-Xms: 128m, -Xmx: 384m}
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: "1", memory: 768Mi}
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/name: orders-outbox-connect-connect
