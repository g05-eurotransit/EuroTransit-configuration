# Kafka disables automatic topic creation; heartbeat delivery must be provisioned.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cdc-heartbeat-orders
  namespace: eurotransit
  labels: {strimzi.io/cluster: eurotransit-kafka}
spec:
  topicName: __debezium-heartbeat.orders
  partitions: 1
  replicas: 3
  config: {cleanup.policy: compact, min.insync.replicas: 2}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: cdc-heartbeat-inventory
  namespace: eurotransit
  labels: {strimzi.io/cluster: eurotransit-kafka}
spec:
  topicName: __debezium-heartbeat.inventory
  partitions: 1
  replicas: 3
  config: {cleanup.policy: compact, min.insync.replicas: 2}
---
apiVersion: kafka.strimzi.io/v1beta2
