apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: shared-worker-patch.yaml
  - path: connector-worker-patch.yaml
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaConnector
      labelSelector: app.kubernetes.io/part-of=eurotransit-marketplace
  - path: shared-ha-patch.yaml
  - path: heartbeat-patch.yaml
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaConnector
      labelSelector: app.kubernetes.io/part-of=eurotransit-marketplace
images:
  - name: eurotransit/debezium-connect
    newTag: kind-ha
configurations:
  - kustomizeconfig.yaml
