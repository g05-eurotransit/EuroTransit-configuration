apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configurations:
  - kustomizeconfig.yaml
patches:
  - path: shared-worker-patch.yaml
  - path: connector-worker-patch.yaml
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaConnector
      labelSelector: app.kubernetes.io/part-of=eurotransit-marketplace
  - path: connect-patch.yaml
    target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaConnect
      name: orders-outbox-connect
images:
  - name: eurotransit/debezium-connect
    newName: eurotransitregistry.azurecr.io/eurotransit/debezium-connect
    digest: sha256:976bd8c3b79b75a20258bec0b1a2351642c207d9b8e1f9f50d50c0a040294bb2
