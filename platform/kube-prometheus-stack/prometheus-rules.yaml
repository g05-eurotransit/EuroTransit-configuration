apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: eurotransit-money-path
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
    release: kube-prometheus-stack
spec:
  groups:
    - name: eurotransit.checkout
      rules:
        - alert: CheckoutFastBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace="eurotransit",app="orders",status=~"5.."}[10m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="eurotransit",app="orders"}[10m]))
            ) > 0.02
          for: 10m
          labels:
            severity: page
          annotations:
            summary: Checkout success-rate SLO is burning fast
            description: Orders is returning elevated 5xx errors on the checkout path.
        - alert: CheckoutLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{namespace="eurotransit",app="orders",uri=~"/api/orders.*"}[15m]))
            ) > 2
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: Checkout p95 latency is above 2 seconds
            description: The money-path latency target is breached for Orders checkout endpoints.
        - alert: KafkaPipelineStalled
          expr: |
            sum(kafka_consumergroup_lag{namespace="eurotransit"}) by (consumergroup) > 100
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: Kafka consumer lag is growing
            description: The async checkout or notification pipeline is not converging.
    - name: eurotransit.reconciliation
      rules:
        # These business gauges deliberately publish zero-valued series for every
        # tracked state/kind. Do not replace them with a counter rate: an incident
        # that remains open must stay visible after its creation window has passed.
        - alert: ReconciliationRecordOpen
          expr: |
            sum by (kind) (
              orders_reconciliation_open{namespace="eurotransit",app="orders"}
            ) > 0
          for: 1m
          labels:
            severity: ticket
          annotations:
            summary: EuroTransit reconciliation record is open
            description: An open {{ $labels.kind }} reconciliation record needs operations review or redrive.
        - alert: PaymentOutcomeUnknown
          expr: |
            max(
              orders_reconciliation_open{
                namespace="eurotransit",
                app="orders",
                kind="PAYMENT_OUTCOME_UNKNOWN"
              }
            ) > 0
          for: 1m
          labels:
            severity: page
          annotations:
            summary: EuroTransit payment outcome is unknown
            description: An abandoned order may have taken money but payment outcome is unknown; immediate operator review required.
        - alert: PaymentReversalFailure
          expr: |
            sum(
              increase(
                orders_reconciliation_required_total{
                  namespace="eurotransit",
                  app="orders",
                  kind="PAYMENT_REVERSAL_FAILURE"
                }[10m]
              )
            ) > 0
          labels:
            severity: page
          annotations:
            summary: EuroTransit payment reversal failed
            description: A payment reversal definitively failed; the affected order must stay in COMPENSATING until money is resolved.
        - alert: InvariantViolation
          expr: |
            sum(
              increase(
                orders_reconciliation_required_total{
                  namespace="eurotransit",
                  app="orders",
                  kind="INVARIANT_VIOLATION"
                }[10m]
              )
            ) > 0
          labels:
            severity: page
          annotations:
            summary: EuroTransit inventory invariant violation requires investigation
            description: Orders recorded a missing reservation, ownership conflict, or seat-count conflict. Investigate before resolving the record.
        - alert: CheckoutStuckNonTerminal
          expr: |
            max by (state) (
              orders_pipeline_oldest_age_seconds{namespace="eurotransit",app="orders"}
            ) > 180
          for: 2m
          labels:
            severity: page
          annotations:
            summary: EuroTransit checkout is stuck in a non-terminal state
            description: The oldest checkout in {{ $labels.state }} has not converged for more than three minutes.
        - alert: ReconciliationAgeHigh
          expr: |
            max(
              orders_reconciliation_oldest_age_seconds{namespace="eurotransit",app="orders"}
            ) > 300
          for: 2m
          labels:
            severity: page
          annotations:
            summary: EuroTransit reconciliation incident is ageing
            description: The oldest open reconciliation incident has remained unresolved for more than five minutes.
        - alert: InventorySeatConflict
          expr: |
            sum(
              increase(
                orders_inventory_confirm_total{
                  namespace="eurotransit",
                  app="orders",
                  result="refused",
                  code="RESERVATION_SEAT_CONFLICT"
                }[5m]
              )
            ) > 0
          labels:
            severity: page
          annotations:
            summary: EuroTransit Inventory reported a reservation seat conflict
            description: Inventory rejected confirmation because the held seats did not match the reservation; inspect the corresponding invariant incident.
        - alert: PoisonOrderEvent
          expr: |
            sum(
              increase(
                orders_events_dlt_total{
                  namespace="eurotransit",
                  app="orders",
                  topic="order-placed-dlt",
                  result="poison"
                }[5m]
              )
            ) > 0
          labels:
            severity: ticket
          annotations:
            summary: EuroTransit received an unparseable order dead-letter event
            description: The dead-letter payload cannot be associated with an order; use its Kafka key and original offset from Orders logs for investigation.
        - alert: DeadLetterUnknownOrder
          expr: |
            sum(
              increase(
                orders_events_dlt_total{
                  namespace="eurotransit",
                  app="orders",
                  topic="order-placed-dlt",
                  result="unknown_order"
                }[5m]
              )
            ) > 0
          labels:
            severity: ticket
          annotations:
            summary: EuroTransit dead-letter event references an unknown order
            description: Orders could parse a dead-letter event but could not attach it to a durable order; investigate the event and data retention before replay.
        - alert: DeadLetterNotRecorded
          expr: |
            sum(
              increase(
                orders_events_dlt_total{
                  namespace="eurotransit",
                  app="orders",
                  result="record_failed"
                }[10m]
              )
            ) > 3
          labels:
            severity: ticket
          annotations:
            summary: EuroTransit dead-letter incident recording is failing
            description: A dead letter that repeatedly fails to record an incident is stalling its topic on that pod.
    - name: eurotransit.inventory
      rules:
        - alert: InventoryReservationFailures
          expr: |
            (
              sum(rate(inventory_holds_rejected_total{namespace="eurotransit", app="inventory"}[5m]))
              /
              sum(rate(inventory_holds_attempted_total{namespace="eurotransit", app="inventory"}[5m]))
            ) > 0.20
          for: 5m
          labels:
            severity: page
          annotations:
            summary: EuroTransit inventory reservation failure ratio is elevated
            description: Over 20% of seat reservation attempts are failing; investigate potential seat contention or database locking issues.
        - alert: InventoryHoldSweepFailure
          expr: |
            sum(
              increase(
                inventory_holds_sweep_errors_total{
                  namespace="eurotransit",
                  app="inventory"
                }[5m]
              )
            ) > 0
          labels:
            severity: page
          annotations:
            summary: EuroTransit inventory expired hold sweeper is failing
            description: The scheduled sweep of expired seat holds encountered database errors; expired seats may remain locked in HELD status.
        - alert: InventoryIdempotencyPurgeFailure
          expr: |
            sum(
              increase(
                inventory_idempotency_purge_errors_total{
                  namespace="eurotransit",
                  app="inventory"
                }[10m]
              )
            ) > 0
          labels:
            severity: ticket
          annotations:
            summary: EuroTransit inventory idempotency record purge is failing
            description: Scheduled cleanup of expired idempotency records failed; inspect inventory database status and query retention.
        - alert: InventoryServiceErrorsHigh
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{namespace="eurotransit", app="inventory", status=~"5.."}[5m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="eurotransit", app="inventory"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: page
          annotations:
            summary: EuroTransit inventory service 5xx error rate is elevated
            description: Inventory internal error rate exceeds 5%; downstream checkout hold and confirmation calls may fail.
