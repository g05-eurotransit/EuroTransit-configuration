apiVersion: v1
kind: ConfigMap
metadata:
  name: eurotransit-dashboard-inventory-correctness
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: eurotransit-marketplace
data:
  inventory-correctness.json: |
    {
      "title": "EuroTransit / Inventory Correctness",
      "uid": "eurotransit-inventory-correctness",
      "tags": ["eurotransit", "inventory", "correctness"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          }
        ]
      },
      "panels": [
        {
          "title": "Hold Operations (Success vs Failed vs Expired)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(inventory_holds_successful_total{namespace=\"eurotransit\", app=\"inventory\"}[5m]))",
              "legendFormat": "Successful Holds/s"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(inventory_holds_failed_total{namespace=\"eurotransit\", app=\"inventory\"}[5m]))",
              "legendFormat": "Failed Holds/s"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(inventory_holds_expired_total{namespace=\"eurotransit\", app=\"inventory\"}[5m]))",
              "legendFormat": "Expired Holds/s"
            }
          ]
        },
        {
          "title": "Post-Hold Transitions (Confirmed vs Refunded)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(inventory_holds_confirmed_total{namespace=\"eurotransit\", app=\"inventory\"}[5m]))",
              "legendFormat": "Confirmed Sales/s"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(inventory_holds_refunded_total{namespace=\"eurotransit\", app=\"inventory\"}[5m]))",
              "legendFormat": "Refunded Seats/s"
            }
          ]
        },
        {
          "title": "Idempotency Hits (Duplicate Request Protection)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(inventory_idempotency_hits_total{namespace=\"eurotransit\", app=\"inventory\"}[5m]))",
              "legendFormat": "Idempotency Hits/s"
            }
          ]
        },
        {
          "title": "Oversell & Invariant Violations",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(orders_reconciliation_required_total{namespace=\"eurotransit\", app=\"orders\", kind=\"INVARIANT_VIOLATION\"}[5m]))",
              "legendFormat": "Invariant Violations"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(orders_inventory_confirm_total{namespace=\"eurotransit\", app=\"orders\", code=\"RESERVATION_SEAT_CONFLICT\"}[5m]))",
              "legendFormat": "Seat Conflicts"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "fillOpacity": 20, "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Invariant Violations" },
                "properties": [ { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } } ]
              },
              {
                "matcher": { "id": "byName", "options": "Seat Conflicts" },
                "properties": [ { "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } } ]
              }
            ]
          }
        }
      ]
    }
