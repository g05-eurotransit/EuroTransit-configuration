apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: eurotransit-kafka-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  namespaceSelector:
    matchNames: [eurotransit]
  selector:
    matchLabels:
      strimzi.io/name: eurotransit-kafka-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      interval: 30s
