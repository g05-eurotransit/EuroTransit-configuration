deployment:
  replicas: 1
service:
  type: ClusterIP
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
podDisruptionBudget:
  enabled: false
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 250m, memory: 256Mi }
nodeSelector:
  kubernetes.io/hostname: eurotransit-control-plane
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
