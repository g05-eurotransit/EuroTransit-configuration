deployment:
  replicas: 1
providers:
  kubernetesIngress:
    enabled: true
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: g05-eurotransit
podDisruptionBudget:
  enabled: false
resources:
  requests: { cpu: 50m, memory: 48Mi }
  limits: { cpu: 300m, memory: 256Mi }
