name: Reliability tooling checks

on:
  pull_request:
    paths:
      - 'charts/eurotransit/**'
      - 'scripts/reliability/**'
      - 'scripts/*reliability*'
      - 'scripts/*provider-audit*'
      - 'scripts/test-checkout-load-shedding.py'
      - 'platform/reliability/**'
      - '.github/workflows/reliability-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4
        with:
          version: 'v4.2.3'
      - name: Install test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Verify runner and evidence contracts
        run: |
          python scripts/test-reliability-runner.py
          python scripts/test-provider-audit.py
          python scripts/test-checkout-load-shedding.py
          python scripts/reliability/test-fault-contract.py
      - name: Validate constrained AKS chart
        run: helm lint charts/eurotransit -f charts/eurotransit/values-production.yaml
      - name: Verify checkout refusal and recovery with local Traefik
        run: python scripts/test-checkout-load-shedding.py --docker
      - name: Verify proxy delay, independent expiry, and neutral restart
        run: python scripts/reliability/test-proxy-local.py
