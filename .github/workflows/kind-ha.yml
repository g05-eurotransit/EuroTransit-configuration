name: Kind HA profile checks
on:
  pull_request:
    paths:
      - 'platform/**'
      - 'charts/eurotransit/**'
      - 'scripts/kind-up.sh'
      - 'scripts/kind-test.sh'
      - 'scripts/render.sh'
      - 'scripts/test-kind-ha-profile.py'
      - 'scripts/test-kind-ha-audit.py'
      - 'scripts/kind-ha-experiment.py'
      - 'scripts/kind-orders-shutdown.py'
      - 'scripts/kind-checkout-load-shedding.py'
      - 'scripts/*catalog*'
      - 'scripts/*aks-sealed-secrets.sh'
      - 'load-tests/**'
      - '.github/workflows/kind-ha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4
        with:
          version: 'v4.2.3'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate manifests and failure-domain invariants
        run: |
          bash -n scripts/kind-up.sh scripts/kind-test.sh scripts/render.sh
          scripts/render.sh kind-ha
          scripts/render.sh kind
          scripts/render.sh aks
          helm lint charts/eurotransit -f charts/eurotransit/values-kind-ha.yaml
          python scripts/test-kind-ha-profile.py
          python scripts/test-catalog-postgres.py
          python scripts/test-catalog-sealed-secret.py
          python -m py_compile scripts/*catalog*.py
          bash -n scripts/generate-aks-sealed-secrets.sh scripts/validate-aks-sealed-secrets.sh
          python -m py_compile scripts/kind-ha-experiment.py scripts/kind-orders-shutdown.py scripts/kind-checkout-load-shedding.py
          python scripts/test-kind-ha-audit.py
          python -m unittest discover -s load-tests/tests -p test_verify.py
