name: Checkout load harness
on:
  pull_request:
    paths: ['load-tests/**', '.github/workflows/load-tests.yml']
  push:
    branches: [main]
    paths: ['load-tests/**', '.github/workflows/load-tests.yml']
  workflow_dispatch:
concurrency:
  group: checkout-harness-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test load-tests/tests/*.test.mjs
      - run: python -m unittest discover -s load-tests/tests -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: load-tests/Dockerfile
          push: false
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: ${{ vars.ACR_REGISTRY || 'eurotransitregistry.azurecr.io' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication credentials
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_USERNAME" && test -n "$ACR_PASSWORD" || { echo 'Configure ACR_USERNAME and ACR_PASSWORD repository secrets.'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: load-tests/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/eurotransit/load-tests:${{ github.sha }}
