global:
  domain: g05.cpo2026.it
  oidc:
    issuerUri: https://g05.cpo2026.it/realms/eurotransit
    jwkSetUri: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/eurotransit/protocol/openid-connect/certs
    audience: eurotransit-api

  podDisruptionBudget:
    enabled: false

ingress:
  localhost:
    enabled: false
  tls:
    secretName: eurotransit-production-tls

catalog:
  replicaCount: 1
  resources:
    requests: { cpu: 75m, memory: 224Mi }
    limits: { cpu: 500m, memory: 512Mi }
orders:
  replicaCount: 1
  resources:
    requests: { cpu: 75m, memory: 320Mi }
    limits: { cpu: 500m, memory: 512Mi }
inventory:
  replicaCount: 1
  resources:
    requests: { cpu: 75m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Keep the demo capacity and expiration reconciler available for checkout.
  bootstrap:
    enabled: true
  reservations:
    expiration:
      enabled: true
payments:
  replicaCount: 1
  resources:
    requests: { cpu: 75m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
notifications:
  replicaCount: 1
  resources:
    requests: { cpu: 75m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 25m, memory: 16Mi }
    limits: { cpu: 200m, memory: 128Mi }
