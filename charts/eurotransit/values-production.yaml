global:
  domain: g05.cpo2026.it
  oidc:
    issuerUri: https://g05.cpo2026.it/realms/eurotransit
    jwkSetUri: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/eurotransit/protocol/openid-connect/certs
    audience: eurotransit-api

  podDisruptionBudget:
    enabled: false

ingress:
  localhost:
    enabled: false
  tls:
    secretName: eurotransit-production-tls

catalog: &service
  replicaCount: 1
  resources:
    requests: { cpu: 75m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }
orders: *service
inventory:
  <<: *service
  # The target-cluster environment is a demo deployment and needs the same
  # sample capacity as local development for checkout to be usable.
  bootstrap:
    enabled: true
payments: *service
notifications: *service

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
