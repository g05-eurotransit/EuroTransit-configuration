{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: eurotransit-public-api
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.global.domain }}`)
      kind: Rule
      priority: 1
      middlewares:
        - name: eurotransit-secure-headers
      services:
        - name: frontend
          port: 8080
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/api/catalog`)
      kind: Rule
      middlewares:
        - name: eurotransit-secure-headers
      services:
        - name: catalog
          port: 8080
    {{- if .Values.ingress.checkoutRateLimit.enabled }}
    {{- $hosts := list .Values.global.domain }}
    {{- if .Values.ingress.localhost.enabled }}
    {{- $hosts = append $hosts "localhost" }}
    {{- end }}
    {{- range $host := uniq $hosts }}
    - match: Host(`{{ $host }}`) && (Path(`/api/orders`) || Path(`/api/orders/`)) && Method(`POST`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: eurotransit-secure-headers
        - name: eurotransit-checkout-rate-limit
        {{- if $.Values.ingress.forwardAuth.enabled }}
        - name: eurotransit-forward-auth
        {{- end }}
      services:
        {{- if $.Values.progressiveDelivery.enabled }}
        - name: orders-weighted
          kind: TraefikService
        {{- else }}
        - name: orders
          port: 8080
        {{- end }}
    {{- end }}
    {{- end }}
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/api/orders`)
      kind: Rule
      middlewares:
        - name: eurotransit-secure-headers
        {{- if .Values.ingress.forwardAuth.enabled }}
        - name: eurotransit-forward-auth
        {{- end }}
      services:
        {{- if .Values.progressiveDelivery.enabled }}
        - name: orders-weighted
          kind: TraefikService
        {{- else }}
        - name: orders
          port: 8080
        {{- end }}
    {{- if .Values.ingress.localhost.enabled }}
    - match: Host(`localhost`) && PathPrefix(`/api/orders`)
      kind: Rule
      middlewares:
        - name: eurotransit-secure-headers
        {{- if .Values.ingress.forwardAuth.enabled }}
        - name: eurotransit-forward-auth
        {{- end }}
      services:
        {{- if .Values.progressiveDelivery.enabled }}
        - name: orders-weighted
          kind: TraefikService
        {{- else }}
        - name: orders
          port: 8080
        {{- end }}
    {{- end }}
    {{- if .Values.notifications.publicApi.enabled }}
    - match: Host(`{{ .Values.global.domain }}`) && PathPrefix(`/api/notifications`)
      kind: Rule
      middlewares:
        - name: eurotransit-secure-headers
        {{- if .Values.ingress.forwardAuth.enabled }}
        - name: eurotransit-forward-auth
        {{- end }}
      services:
        - name: notifications
          port: 8080
    {{- end }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName | quote }}
{{- end }}
