apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    app: orders
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: orders
---
{{- if .Values.progressiveDelivery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: orders-canary
  labels:
    app: orders
    app.kubernetes.io/component: canary
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: orders
{{- end }}
