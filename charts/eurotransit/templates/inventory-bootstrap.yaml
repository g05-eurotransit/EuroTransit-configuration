{{- if .Values.inventory.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-bootstrap
  labels:
    app: inventory-bootstrap
    app.kubernetes.io/part-of: eurotransit-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  bootstrap.sql: |
    WITH demo_routes(route_id) AS (
        VALUES
            ('rt-to-mi-001'),
            ('rt-mi-pa-002'),
            ('rt-mi-zu-003'),
            ('rt-ro-vi-004'),
            ('rt-to-ly-005')
    ),
    demo_seats(seat_id) AS (
        SELECT row_number::text || column_name
        FROM generate_series(1, 6) AS rows(row_number)
        CROSS JOIN (VALUES ('A'), ('B'), ('C'), ('D')) AS columns(column_name)
    ),
    demo_dates(travel_date) AS (
        SELECT generated_at::date
        FROM generate_series(
            CURRENT_DATE,
            (CURRENT_DATE + INTERVAL '6 months')::date,
            INTERVAL '1 day'
        ) AS dates(generated_at)
    )
    INSERT INTO seats (route_id, travel_date, seat_id, status)
    SELECT route_id, travel_date, seat_id, 'AVAILABLE'
    FROM demo_routes
    CROSS JOIN demo_dates
    CROSS JOIN demo_seats
    ON CONFLICT (route_id, travel_date, seat_id) DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-bootstrap
  labels:
    app: inventory-bootstrap
    app.kubernetes.io/part-of: eurotransit-marketplace
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: inventory-bootstrap
        app.kubernetes.io/part-of: eurotransit-marketplace
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ .Values.inventory.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - psql
            - --set=ON_ERROR_STOP=1
            - --file=/bootstrap/bootstrap.sql
          env:
            - name: PGHOST
              value: {{ .Values.global.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.global.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.inventory.database.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inventory.database.secretName | quote }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.inventory.database.secretName | quote }}
                  key: password
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: inventory-bootstrap
{{- end }}
