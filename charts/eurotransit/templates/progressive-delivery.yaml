{{- if .Values.progressiveDelivery.enabled }}
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: orders-weighted
  labels:
    app: orders
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  weighted:
    services:
      - name: orders
        port: 8080
        weight: 100
      - name: orders-canary
        port: 8080
        weight: 0
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: catalog-preview-smoke
spec:
  args:
    - name: preview-hash
  metrics:
    - name: preview-requests
      initialDelay: {{ .Values.progressiveDelivery.analysis.initialDelay | quote }}
      interval: 30s
      count: 2
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            sum(rate(http_server_requests_seconds_count{app="catalog",rollouts_pod_template_hash="{{`{{args.preview-hash}}`}}"}[1m])) or vector(0)
      successCondition: len(result) > 0 && result[0] > 0
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: orders-canary-guardrails
spec:
  args:
    - name: canary-hash
  metrics:
    # Controlled demo policy: minimum evidence and absolute error budgets.
    # Lifetime counters expose even a first scrape at 1; coverage rejects old
    # images/missing metrics. These gates are not production percentage SLOs.
    - name: canary-metric-coverage
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            ((count(max by (instance) (up{service=~"orders|orders-canary",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"})) or vector(0))
            -
            (count((max by (instance) (up{service=~"orders|orders-canary",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}) == 1)
              and on (instance) (max by (instance) (orders_checkout_completed_total{result="confirmed",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}) >= 0)
              and on (instance) (max by (instance) (orders_checkout_completed_total{result="failed",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}) >= 0)
              and on (instance) (max by (instance) (orders_checkout_failed_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}) >= 0)
              and on (instance) (count by (instance) (max by (instance, topic, failure_class) (orders_events_exhausted_total{topic=~"order-placed|refund-requested",failure_class=~"poison_payload|dependency_error|unknown",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"})) == 6)
              and on (instance) (max by (instance) (process_start_time_seconds{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}) <= time() - {{ .Values.progressiveDelivery.analysis.orders.minProcessAgeSeconds }})
            ) or vector(0)))
            - ((count(max by (instance) (up{service=~"orders|orders-canary",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"})) or vector(0)) == bool 0)
      successCondition: len(result) == 1 && result[0] == 0
    - name: canary-http-samples
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            sum(max by (instance, method, uri, status, outcome, exception) (increase(http_server_requests_seconds_count{app="orders",uri!~"/actuator.*",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}]))) or vector(0)
      successCondition: len(result) == 1 && result[0] >= {{ .Values.progressiveDelivery.analysis.orders.minHttpRequests }}
    - name: http-5xx-count
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            sum(max by (instance, method, uri, status, outcome, exception) (http_server_requests_seconds_count{app="orders",uri!~"/actuator.*",status=~"5..",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"})) or vector(0)
      successCondition: len(result) == 1 && result[0] <= {{ .Values.progressiveDelivery.analysis.orders.maxHttp5xx }}
    - name: p95-latency-seconds
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            histogram_quantile(0.95, sum by (le) (max by (instance, le, method, uri, status, outcome, exception) (rate(http_server_requests_seconds_bucket{app="orders",uri!~"/actuator.*",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}]))))
      successCondition: len(result) == 1 && result[0] < {{ .Values.progressiveDelivery.analysis.orders.maxP95Seconds }}
    - name: canary-confirmed-checkouts
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            sum(max by (instance) (increase(orders_checkout_completed_total{result="confirmed",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}]))) or vector(0)
      successCondition: len(result) == 1 && result[0] >= {{ .Values.progressiveDelivery.analysis.orders.minConfirmedCheckouts }}
    - name: canary-checkout-failures
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            sum(max by (instance, reason) (orders_checkout_failed_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"})) or vector(0)
      successCondition: len(result) == 1 && result[0] <= {{ .Values.progressiveDelivery.analysis.orders.maxCheckoutFailures }}
    - name: canary-exhausted-events
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            sum(max by (instance, topic, failure_class) (orders_events_exhausted_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"})) or vector(0)
      successCondition: len(result) == 1 && result[0] <= {{ .Values.progressiveDelivery.analysis.orders.maxExhaustedEvents }}
    - name: canary-counter-continuity
      initialDelay: {{ .Values.progressiveDelivery.analysis.orders.initialDelay | quote }}
      interval: {{ .Values.progressiveDelivery.analysis.orders.interval | quote }}
      count: {{ .Values.progressiveDelivery.analysis.orders.count }}
      failureLimit: 0
      provider:
        prometheus:
          address: {{ .Values.progressiveDelivery.analysis.prometheusAddress | quote }}
          query: |
            (sum(changes(process_start_time_seconds{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}])) or vector(0))
            +
            (sum(resets(orders_checkout_completed_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}])) or vector(0))
            +
            (sum(resets(orders_checkout_failed_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}])) or vector(0))
            +
            (sum(resets(orders_events_exhausted_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}])) or vector(0))
            +
            (sum(resets(http_server_requests_seconds_count{app="orders",uri!~"/actuator.*",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[{{ .Values.progressiveDelivery.analysis.orders.window }}])) or vector(0))
      successCondition: len(result) == 1 && result[0] == 0
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: catalog
  labels:
    app: catalog
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  {{- if .Values.progressiveDelivery.workloadRef }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
    scaleDown: progressively
  {{- end }}
  strategy:
    blueGreen:
      activeService: catalog
      previewService: catalog-preview
      previewReplicaCount: 1
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 60
      prePromotionAnalysis:
        templates:
          - templateName: catalog-preview-smoke
        args:
          - name: preview-hash
            valueFrom:
              podTemplateHashValue: Latest
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders
  labels:
    app: orders
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  {{- if .Values.progressiveDelivery.workloadRef }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders
    scaleDown: progressively
  {{- end }}
  strategy:
    canary:
      stableService: orders
      canaryService: orders-canary
      canaryMetadata:
        labels:
          app.kubernetes.io/component: canary
      canaryReplicaCount: 1
      trafficRouting:
        traefik:
          weightedTraefikServiceName: orders-weighted
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: orders-canary-guardrails
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - pause: {}
        - setWeight: 25
        - analysis:
            templates:
              - templateName: orders-canary-guardrails
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - pause: {}
        - setWeight: 50
        - analysis:
            templates:
              - templateName: orders-canary-guardrails
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - pause: {}
        - setWeight: 100
        - pause: {}
{{- end }}
