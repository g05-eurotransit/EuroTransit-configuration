{{- if or (not .Values.progressiveDelivery.enabled) .Values.progressiveDelivery.workloadRef }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
spec:
  replicas: {{ .Values.orders.replicaCount }}
  revisionHistoryLimit: {{ .Values.global.deployment.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.global.deployment.minReadySeconds }}
  strategy:
    {{- toYaml .Values.global.deployment.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      terminationGracePeriodSeconds: {{ .Values.global.deployment.terminationGracePeriodSeconds }}
      {{- if .Values.global.deployment.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.global.deployment.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.global.deployment.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.global.deployment.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: orders
      {{- end }}
      {{- if .Values.global.deployment.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.global.deployment.podAntiAffinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: orders
              topologyKey: {{ .Values.global.deployment.podAntiAffinity.topologyKey }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.global.deployment.podAntiAffinity.weight }}
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: orders
                topologyKey: {{ .Values.global.deployment.podAntiAffinity.topologyKey }}
          {{- end }}
      {{- end }}
      containers:
        - name: orders
          image: "{{ .Values.orders.image.repository }}:{{ .Values.orders.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "cluster"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ .Values.global.oidc.issuerUri | quote }}
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: {{ .Values.global.oidc.jwkSetUri | quote }}
            - name: EUROTRANSIT_SECURITY_OIDC_AUDIENCE
              value: {{ .Values.global.oidc.audience | quote }}
            - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
              value: {{ .Values.global.observability.tracing.enabled | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.global.observability.tracing.endpoint | quote }}
            - name: DB_HOST
              value: {{ .Values.global.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.global.database.port | quote }}
            - name: DB_NAME
              value: {{ .Values.orders.database.name | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orders.database.secretName | quote }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orders.database.secretName | quote }}
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.global.kafka.bootstrapServers | quote }}
            - name: EUROTRANSIT_SERVICES_INVENTORY_URL
              value: {{ .Values.orders.services.inventoryUrl | quote }}
            - name: EUROTRANSIT_SERVICES_PAYMENTS_URL
              value: {{ .Values.orders.services.paymentsUrl | quote }}
            - name: ORDERS_SERVICE_TOKEN_URI
              value: {{ .Values.orders.serviceAuth.tokenUri | quote }}
            - name: ORDERS_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orders.serviceAuth.secretName | quote }}
                  key: {{ .Values.orders.serviceAuth.secretKey | quote }}
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: SERVER_SHUTDOWN
              value: "graceful"
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: "30s"
          {{- if gt (int .Values.global.deployment.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.global.deployment.preStopSleepSeconds }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.global.deployment.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.global.deployment.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.global.deployment.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.global.deployment.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.global.deployment.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.global.deployment.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.global.deployment.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.global.deployment.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.global.deployment.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.global.deployment.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.global.deployment.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.global.deployment.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.orders.resources | nindent 12 }}
{{- end }}
