{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eurotransit-secure-headers
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
{{- if .Values.ingress.forwardAuth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eurotransit-forward-auth
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  forwardAuth:
    address: {{ .Values.ingress.forwardAuth.address | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - Authorization
      - X-Forwarded-User
      - X-Forwarded-Groups
      - X-Correlation-Id
{{- end }}
{{- end }}

