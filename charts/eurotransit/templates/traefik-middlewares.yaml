{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eurotransit-secure-headers
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
{{- if .Values.ingress.forwardAuth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eurotransit-forward-auth
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  forwardAuth:
    address: {{ .Values.ingress.forwardAuth.address | quote }}
    trustForwardHeader: true
    authResponseHeaders:
      - Authorization
      - X-Forwarded-User
      - X-Forwarded-Groups
      - X-Correlation-Id
{{- end }}
{{- end }}


{{- if and .Values.ingress.enabled .Values.ingress.checkoutRateLimit.enabled }}
{{- $limit := .Values.ingress.checkoutRateLimit }}
{{- if or (not (regexMatch "^[1-9][0-9]*$" (toString $limit.average))) (not (regexMatch "^[1-9][0-9]*$" (toString $limit.burst))) }}
{{- fail "checkoutRateLimit average and burst must be positive integers" }}
{{- end }}
{{- if not (regexMatch "^[1-9][0-9]*(ms|s|m)$" (toString $limit.period)) }}
{{- fail "checkoutRateLimit period must be a positive integer duration in ms, s or m" }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: eurotransit-checkout-rate-limit
  labels:
    app.kubernetes.io/part-of: eurotransit-marketplace
spec:
  rateLimit:
    average: {{ $limit.average }}
    period: {{ $limit.period | quote }}
    burst: {{ $limit.burst }}
    sourceCriterion:
      requestHost: true
{{- end }}
