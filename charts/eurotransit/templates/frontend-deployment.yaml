apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: {{ .Values.global.deployment.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.global.deployment.minReadySeconds }}
  strategy:
    {{- toYaml .Values.global.deployment.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      annotations:
        checksum/runtime-config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum | quote }}
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.global.deployment.terminationGracePeriodSeconds }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /config/config.json
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: frontend-runtime-config
