global:
  domain: eurotransit.local
  database:
    host: eurotransit-postgres-rw
    port: 5432
    secretName: db-credentials
  kafka:
    bootstrapServers: eurotransit-kafka-kafka-bootstrap:9092
  oidc:
    issuerUri: https://keycloak.eurotransit.local/realms/eurotransit
    jwkSetUri: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/eurotransit/protocol/openid-connect/certs
    audience: eurotransit-api
  observability:
    tracing:
      enabled: false
      endpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  deployment:
    minReadySeconds: 10
    revisionHistoryLimit: 3
    terminationGracePeriodSeconds: 45
    preStopSleepSeconds: 10
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    topologySpreadConstraints:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    podAntiAffinity:
      enabled: true
      type: preferred
      weight: 100
      topologyKey: kubernetes.io/hostname
    probes:
      startup:
        path: /actuator/health/liveness
        failureThreshold: 30
        periodSeconds: 2
        timeoutSeconds: 2
      liveness:
        path: /actuator/health/liveness
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        path: /actuator/health/readiness
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
ingress:
  enabled: true
  entryPoints:
    - websecure
  localhost:
    enabled: true
  tls:
    secretName: eurotransit-local-tls
  checkoutRateLimit:
    # Per request host and Traefik replica; these are initial values, not measured capacity.
    enabled: false
    average: 10
    period: 1s
    burst: 20
  forwardAuth:
    enabled: false
    address: http://keycloak-forward-auth.eurotransit.svc.cluster.local:4181
monitoring:
  serviceMonitors:
    enabled: true
    releaseLabel: kube-prometheus-stack
    path: /actuator/prometheus
    interval: 30s
networkPolicies:
  enabled: true
  traefikNamespace: traefik
  monitoringNamespace: monitoring
  cloudNativePGNamespace: cnpg-system
progressiveDelivery:
  # First migration phase: Argo Rollouts adopts the existing Deployments via
  # workloadRef.  This preserves the current ReplicaSets while the controller
  # takes ownership.  The documented second phase removes these Deployments
  # only after the delivery proof is complete.
  enabled: false
  workloadRef: true
  analysis:
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    # Wait for three 30-second scrapes before evaluating a new pod hash.
    initialDelay: 90s
    orders:
      # Five minutes allows ~5-13 outcomes at 1/3 Kafka exposure and 3-8/min.
      # Require four confirmed outcomes; this is a fixture smoke budget, not an SLO.
      initialDelay: 5m
      interval: 60s
      count: 2
      window: 5m
      minProcessAgeSeconds: 300
      minHttpRequests: 4
      minConfirmedCheckouts: 4
      maxHttp5xx: 0
      maxCheckoutFailures: 0
      maxExhaustedEvents: 0
      maxP95Seconds: 1
catalog:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/catalog
    tag: "7866ea8" # Will be overridden by CI
  replicaCount: 2
  resources: {}
orders:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/orders
    tag: "7866ea8"
  replicaCount: 2
  resources: {}
  database:
    name: orders_db
    secretName: orders-db-credentials
  services:
    inventoryUrl: http://inventory:8080
    paymentsUrl: http://payments:8080
    # Resolved once per checkout, to price the offer and freeze its refund terms on the order.
    # Without it Orders falls back to its localhost default and answers 503 OFFER_UNRESOLVABLE to
    # every checkout that carries an offerId.
    catalogUrl: http://catalog:8080
  serviceAuth:
    tokenUri: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/eurotransit/protocol/openid-connect/token
    secretName: orders-service-credentials
    secretKey: client-secret
loadTest:
  image: grafana/k6:0.57.0
  clientSecretName: eurotransit-load-test-credentials
  # A small, continuous demo load: two VUs for 45 minutes by default.
  duration: 45m
  # Stripe's sandbox accepts this public test token as a source.
  paymentMethodToken: tok_visa
  # First day of the 15-day non-overlapping demo range after Job startup.
  startOffsetDays: 7
  # The CronJob remains suspended.  Operators create a one-off Job from it.
  schedule: "0 0 31 2 *"
inventory:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/inventory
    tag: "7866ea8"
  replicaCount: 2
  resources: {}
  database:
    name: inventory_db
    secretName: inventory-db-credentials
  reservations:
    expiration:
      enabled: false
  bootstrap:
    enabled: false
    image: postgres:16.8-alpine
payments:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/payments
    tag: "5798dd1"
  replicaCount: 2
  resources: {}
  database:
    name: payments_db
    secretName: payments-db-credentials
  provider:
    sandboxUrl: https://api.stripe.com/v1
    secretName: payments-provider-credentials
    secretKey: provider-api-key
notifications:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/notifications
    tag: "7866ea8"
  replicaCount: 2
  resources: {}
  publicApi:
    enabled: true
frontend:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/frontend
    tag: "e8be067"
  replicaCount: 2
  resources: {}
  config:
    keycloakClientId: eurotransit-frontend
    apiBase: /api
    stripePublishableKey: pk_test_51TqEM0Jy7wiWeUdBtmQuEie1l4VxcLYC6LMJbAumROdVx89kWdB5LSWNn3DW2l1rxBCyZyUZwuRi4KElmUvx5yWb00aDZTVy9M
# Independent operational runner. Enabling this renders only a suspended template.
reliabilityTests:
  enabled: false
  image: "" # Immutable configuration load-tests image (commit SHA or digest).
  clientSecretName: eurotransit-load-test-credentials
