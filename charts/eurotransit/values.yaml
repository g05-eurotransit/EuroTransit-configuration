global:
  domain: eurotransit.local
  database:
    host: eurotransit-db-rw
    port: 5432
    secretName: db-credentials
  deployment:
    minReadySeconds: 10
    revisionHistoryLimit: 3
    terminationGracePeriodSeconds: 45
    preStopSleepSeconds: 10
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    topologySpreadConstraints:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    podAntiAffinity:
      enabled: true
      type: preferred
      weight: 100
      topologyKey: kubernetes.io/hostname
    probes:
      startup:
        path: /actuator/health/liveness
        failureThreshold: 30
        periodSeconds: 2
        timeoutSeconds: 2
      liveness:
        path: /actuator/health/liveness
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        path: /actuator/health/readiness
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

catalog:
  image:
    repository: eurotransit/catalog
    tag: "latest" # Will be overridden by CI
  replicaCount: 2
  resources: {}

orders:
  image:
    repository: eurotransit/orders
    tag: "latest"
  replicaCount: 2
  resources: {}

inventory:
  image:
    repository: eurotransit/inventory
    tag: "latest"
  replicaCount: 2
  resources: {}

payments:
  image:
    repository: eurotransit/payments
    tag: "latest"
  replicaCount: 2
  resources: {}

notifications:
  image:
    repository: eurotransit/notifications
    tag: "latest"
  replicaCount: 2
  resources: {}
