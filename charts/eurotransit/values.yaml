global:
  domain: eurotransit.local
  database:
    host: eurotransit-db-rw
    port: 5432
    secretName: db-credentials
  deployment:
    minReadySeconds: 10
    revisionHistoryLimit: 3
    terminationGracePeriodSeconds: 45
    preStopSleepSeconds: 10
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    topologySpreadConstraints:
      enabled: true
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    podAntiAffinity:
      enabled: true
      type: preferred
      weight: 100
      topologyKey: kubernetes.io/hostname
    probes:
      startup:
        path: /actuator/health/liveness
        failureThreshold: 30
        periodSeconds: 2
        timeoutSeconds: 2
      liveness:
        path: /actuator/health/liveness
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      readiness:
        path: /actuator/health/readiness
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
catalog:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/catalog
    tag: "fb5569d" # Will be overridden by CI
  replicaCount: 2
  resources: {}
orders:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/orders
    tag: "fb5569d"
  replicaCount: 2
  resources: {}
inventory:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/inventory
    tag: "fb5569d"
  replicaCount: 2
  resources: {}
payments:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/payments
    tag: "fb5569d"
  replicaCount: 2
  resources: {}
notifications:
  image:
    repository: eurotransitregistry.azurecr.io/eurotransit/notifications
    tag: "fb5569d"
  replicaCount: 2
  resources: {}
